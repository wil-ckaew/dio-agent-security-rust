name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit
      - run: cargo audit

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny
      - run: cargo deny check

  build-test-coverage:
    name: build, test, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        run: cargo install cargo-nextest --locked
      - name: Install llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Build
        run: cargo build --verbose
      - name: Test with nextest
        run: cargo nextest run --profile ci
      - name: Coverage
        run: cargo llvm-cov nextest --lib --text --fail-under-lines 80
      - name: Coverage HTML (artifact)
        run: cargo llvm-cov nextest --html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: target/llvm-cov/html/

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [cargo-audit, cargo-deny, build-test-coverage]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "cargo-audit: ${{ needs.cargo-audit.result }}"
          echo "cargo-deny: ${{ needs.cargo-deny.result }}"
          echo "build-test-coverage: ${{ needs.build-test-coverage.result }}"
          if [ "${{ needs.cargo-audit.result }}" != "success" ] || \
             [ "${{ needs.cargo-deny.result }}" != "success" ] || \
             [ "${{ needs.build-test-coverage.result }}" != "success" ]; then
            echo "::error::Security checks failed"
            exit 1
          fi
          echo "All checks passed"
